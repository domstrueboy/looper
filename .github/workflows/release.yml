name: Build and Release

# Every push and pull request is tested and built. A push to main is
# also released - but only when Cargo.toml's version is a release one
# ("0.2.0", not "0.2.0-dev") that has no tag yet. So pushing work in
# progress is safe, and releasing is an edit a person makes: drop
# "-dev", push; afterwards set the next "-dev" by hand.
#
# The tag is made by the release itself, after the tests and the build
# have passed - never before, so no tag exists without its zip.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not both see the tag missing and
# both release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          release=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && [ "${{ github.event_name }}" = push ] \
            && [ "${{ github.ref }}" = refs/heads/main ]; then
            # The checkout is shallow and carries no tags.
            git fetch --tags --quiet
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::notice::v$version is already released - set the next -dev version"
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # asio-sys (used by cpal's "asio" feature) can auto-download the
      # Steinberg ASIO SDK during `cargo build`, but that path may expect
      # something interactive that won't work on a headless runner. Point
      # it explicitly at the GPLv3 fallback copy instead (see PLAN.md).
      - name: Fetch ASIO SDK (GPLv3 fallback)
        shell: pwsh
        run: git clone --depth 1 https://github.com/audiosdk/asio "${{ github.workspace }}\asio-sdk"

      - name: Run tests
        shell: pwsh
        env:
          CPAL_ASIO_DIR: ${{ github.workspace }}\asio-sdk
        run: cargo test --locked

      - name: Build release
        shell: pwsh
        env:
          CPAL_ASIO_DIR: ${{ github.workspace }}\asio-sdk
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/looper_pedal.exe dist/
          Compress-Archive -Path dist/* -DestinationPath looper-pedal-${{ steps.version.outputs.version }}-windows-x64.zip

      # Every build's zip, release or not, so a -dev build can be tried
      # from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: looper-pedal-${{ steps.version.outputs.version }}-windows-x64
          path: looper-pedal-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Create release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: looper-pedal-${{ steps.version.outputs.version }}-windows-x64.zip
