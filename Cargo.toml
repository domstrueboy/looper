# The workspace root. It carries no code of its own - the app is
# `crates/looper-app` - and exists so the audio, core and UI halves can
# become crates of their own without moving anything again.
#
# The version lives here rather than in each crate: they're released
# together as one app. "-dev" while work goes on; dropping it and pushing
# is what releases - see .github/workflows/release.yml.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "MIT"
