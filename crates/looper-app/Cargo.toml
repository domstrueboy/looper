[package]
name = "looper-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The executable keeps its own name: it's what the release zip carries
# and what anyone who already has the app will look for.
[[bin]]
name = "looper_pedal"
path = "src/main.rs"

# Build-only, and the sole way to put an icon into a Windows executable:
# it drives the SDK's resource compiler. Nothing of it ships in the binary.
[build-dependencies]
winresource = "0.1"

[dependencies]
looper-core = { path = "../looper-core" }
# The backends themselves. ASIO is the only one built today; asking for
# it here is what pulls `cpal` into the build at all.
looper-hal = { path = "../looper-hal", features = ["asio"] }
looper-ui-egui = { path = "../looper-ui-egui" }
eframe = { version = "0.36.1", features = ["glow"] }
egui = "0.36.1"
