[package]
name = "looper-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

# The traits, the types and the mock cost nothing. `cpal` arrives only
# if someone asks for it, so a core test run - and any build for a
# platform this app hasn't been taught yet - needs no audio SDK.
[features]
default = []
cpal = ["dep:cpal"]
# ASIO additionally needs the Steinberg SDK and LLVM at build time,
# which is why it is not simply implied by `cpal`.
asio = ["cpal", "cpal/asio"]

[dependencies]
cpal = { version = "0.18.2", optional = true }

[[example]]
name = "list_devices"
required-features = ["cpal"]

[[example]]
name = "open_device"
required-features = ["cpal"]
